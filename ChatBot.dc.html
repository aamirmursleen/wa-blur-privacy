<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_svg.min.js"></script>
<meta name="ext-resource-dependency" content="assets/sloth-bot.json">
<style>

@keyframes cbIn{from{opacity:0;transform:translateY(16px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes cbMsg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

</helmet>

<div style="position:fixed; right:clamp(12px,2vw,24px); bottom:clamp(12px,2vw,24px); z-index:150; display:flex; flex-direction:column; align-items:flex-end; gap:12px; font-family:Geist,system-ui,sans-serif; color:#1F2A17; pointer-events:none;">

    <div role="dialog" aria-label="WA Blur assistant" style="pointer-events:auto; width:min(392px, calc(100vw - 24px)); height:min(640px, calc(100vh - 110px)); display:flex; flex-direction:column; border-radius:28px; overflow:hidden; background:#F6F9F1; box-shadow:0 1px 2px rgba(40,60,20,.06), 0 40px 90px -20px rgba(40,70,20,.45); border:1px solid #E6EDDC; animation:cbIn .35s cubic-bezier(.2,.7,.2,1) both;">

      <div style="position:relative; overflow:hidden; padding:16px 16px 18px; background:linear-gradient(150deg,#5A9624 0%,#4E8A1A 38%,#3B6E12 70%,#2C5409 100%); color:#fff; display:flex; flex-direction:column; gap:14px; isolation:isolate;">
        <div style="position:absolute; z-index:-1; width:260px; height:260px; right:-90px; top:-140px; border-radius:50%; background:radial-gradient(closest-side, rgba(205,229,174,.35), transparent);"></div>

            <span style="position:absolute; right:-2px; bottom:-2px; width:12px; height:12px; border-radius:50%; background:#CDE5AE; border:2px solid #3B6E12;"></span>

            <span style="font-size:16px; font-weight:600; letter-spacing:-.01em;">WA Blur assistant</span>
            <span style="font-size:12px; color:rgba(255,255,255,.82);">{{ statusLine }}</span>
          </span>
          <button onClick="{{ reset }}" aria-label="New conversation" title="New conversation" style="width:36px; height:36px; border-radius:12px; border:0; background:rgba(255,255,255,.14); color:#fff; font-size:15px; cursor:pointer; transition:background .2s;" style-hover="background:rgba(255,255,255,.26);">↺</button>
          <button onClick="{{ close }}" aria-label="Close chat" style="width:36px; height:36px; border-radius:12px; border:0; background:rgba(255,255,255,.14); color:#fff; font-size:18px; cursor:pointer; transition:background .2s;" style-hover="background:rgba(255,255,255,.26);">×</button>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <span style="font:500 11px 'Geist Mono'; padding:5px 9px; border-radius:99px; background:rgba(255,255,255,.14);">Features</span>
          <span style="font:500 11px 'Geist Mono'; padding:5px 9px; border-radius:99px; background:rgba(255,255,255,.14);">Pricing</span>
          <span style="font:500 11px 'Geist Mono'; padding:5px 9px; border-radius:99px; background:rgba(255,255,255,.14);">Privacy</span>
          <span style="font:500 11px 'Geist Mono'; padding:5px 9px; border-radius:99px; background:rgba(255,255,255,.14);">Setup</span>

      </div>

      <div ref="{{ listRef }}" data-cb-list="1" style="flex:1; min-height:0; overflow-y:auto; padding:16px 14px 8px; display:flex; flex-direction:column; gap:12px; scrollbar-width:thin;">

              <div style="display:flex; flex-direction:column; gap:8px; min-width:0;">

      </form>
    </div>
  </sc-if>

  <div style="pointer-events:auto; display:flex; align-items:center; gap:6px;">
    <sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ toggle }}" aria-label="Open helpline chat" style="display:flex; align-items:center; gap:4px; padding:0; border:0; background:transparent; cursor:pointer; animation:cbIn .5s .4s cubic-bezier(.2,.7,.2,1) both;">

          <span style="font:600 14px Geist; color:#1F2A17; white-space:nowrap;">I'm here for help!</span>

        <span style="display:block; width:34px; height:24px; animation:cbPoint 1.4s ease-in-out infinite;">
          <svg viewBox="0 0 34 24" width="34" height="24" fill="none" stroke="#4E8A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6 C 10 2, 20 4, 28 14"></path><path d="M20 15 L 29 15 L 28 6"></path></svg>
        </span>
      </button>
    </sc-if>
    <button onClick="{{ toggle }}" aria-label="{{ launcherLabel }}" style="position:relative; width:60px; height:60px; border-radius:50%; border:0; background:{{ launcherBg }}; color:#fff; cursor:pointer; display:grid; place-items:center; box-shadow:0 16px 34px -12px rgba(40,70,20,.7); animation:{{ launcherAnim }}; transition:transform .25s cubic-bezier(.3,.8,.3,1.3), background .25s;" style-hover="transform:scale(1.07);">
      <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><span style="font-size:26px; line-height:1;">×</span></sc-if>
      <sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}"><span style="position:relative; display:block; width:54px; height:54px; border-radius:50%; overflow:hidden; background:#EEF5E4; border:2px solid #fff;"><span data-sloth="1" style="position:absolute; width:244.2%; height:138.4%; left:-102.6%; top:-12.1%; display:block;"></span></span></sc-if>
      <sc-if value="{{ unread }}" hint-placeholder-val="{{ false }}"><span style="position:absolute; top:-2px; right:-2px; min-width:20px; height:20px; padding:0 5px; border-radius:99px; background:#CDE5AE; color:#2C5409; border:2px solid #fff; font:700 11px Geist; display:grid; place-items:center;">1</span></sc-if>
    </button>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:760},&quot;startOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;useAI&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">

  KB = [

    { k: ['free', 'muft', 'free plan', 'without paying'], l: ['install', 'pricing'],

    { k: ['what is', 'what does', 'kya hai', 'about', 'extension do', 'purpose'], l: ['features', 'install'],
      a: 'WA Blur and Privacy is a Chrome extension for WhatsApp Web. It blurs messages, names, photos and previews when someone is near your screen, locks WhatsApp Web with a PIN, and adds tools like reminders, quick replies, a smart inbox, translation and chat export. Everything runs on your own computer.' },
    { k: ['install', 'download', 'add to chrome', 'setup', 'set up', 'get started', 'kaise', 'start'], l: ['install', 'how'],
      a: 'Install it from the Chrome Web Store, then open web.whatsapp.com. A short onboarding opens: it explains what the extension reads and stores, asks for your agreement, lets you pick what to hide, and (optionally) create a PIN. It takes under a minute.' },
    { k: ['blur', 'hide', 'chupa', 'areas', 'strength'], l: ['features', 'tools'],

      a: 'You can lock WhatsApp Web behind a 6–12 digit PIN, by hand (Ctrl/⌘ + Shift + L) or automatically after 1, 5, 15 or 30 idle minutes. Your PIN is stored only as a salted hash on your computer — never the PIN itself.' },

  SUGGEST = ['What does it do?', 'Is it free?', 'How much is Pro?', 'Is my data safe?', 'Keyboard shortcuts', 'Can it record calls?'];
  SYSTEM = () => `You are the friendly assistant on the website of "WA Blur and Privacy by WASecret.com", a Chrome extension for WhatsApp Web. Answer ONLY from the facts below. Be concise (2–5 short sentences or a short bullet list), warm and plain-spoken. Reply in the user's language (English, Urdu or Roman Urdu). Never invent features, prices, dates, policies or numbers. If something isn't covered, say you're not sure and suggest emailing hello@wasecret.com. No markdown headings, no bold; plain text and "•" bullets only.\n\nFACTS:\n` + this.KB.map(x => '- ' + x.a.replace(/\n/g, ' ')).join('\n') + `\n- The website has pages: Features, Pricing, About, Contact, Privacy Policy, Terms of Service, Cookie Policy, Disclaimer, DMCA Policy.\n- Version 3.46.16.`;

  state = { open: false, msgs: [], draft: '', typing: false, focus: false, nudge: false, unread: false };
  componentDidMount() {
    try { const s = JSON.parse(localStorage.getItem(this.KEY) || 'null'); if (s && Array.isArray(s.msgs)) this.setState({ msgs: s.msgs.slice(-40) }); } catch (e) {}
    if (this.props.startOpen) this.openChat();
    this.nt = setTimeout(() => { if (!this.state.open && !this.state.msgs.length) this.setState({ nudge: true, unread: true }); }, 6000);
    this.onEsc = (e) => { if (e.key === 'Escape' && this.state.open) this.setState({ open: false }); };
    window.addEventListener('keydown', this.onEsc);
    this.mountSloths();
  }
  mountSloths() {
    const init = () => {
      if (!window.lottie) return;
      const els = [...document.querySelectorAll('[data-sloth]')].filter(el => !el.__lot);
      if (!els.length) return;
      if (!this.slothData) { if (!this.slothP) this.slothP = fetch('assets/sloth-bot.json').then(r => r.json()).then(d => { this.slothData = d; init(); }).catch(() => {}); return; }
      els.forEach(el => { el.__lot = window.lottie.loadAnimation({ container: el, renderer: 'svg', loop: true, autoplay: true,
        animationData: JSON.parse(JSON.stringify(this.slothData)), rendererSettings: { preserveAspectRatio: 'xMidYMid meet' } }); });
    };
    this.slothTimer = setInterval(init, 250); init();
  }
  componentWillUnmount() { clearInterval(this.slothTimer); clearTimeout(this.nt); window.removeEventListener('keydown', this.onEsc); }
  save(msgs) { try { localStorage.setItem(this.KEY, JSON.stringify({ msgs: msgs.slice(-40) })); } catch (e) {} }
  findInput() { return this.inputRef.current || document.querySelector('[data-cb-input]'); }
  autosize() { requestAnimationFrame(() => { const ta = this.findInput(); if (ta) { ta.style.height = 'auto'; ta.style.height = Math.min(110, ta.scrollHeight) + 'px'; } }); }
  openChat() { this.setState({ open: true, nudge: false, unread: false });
    this.toBottom(false); setTimeout(() => { const ta = this.findInput(); ta && ta.focus(); }, 80); }
  findList() { return this.listRef.current || document.querySelector('[data-cb-list]'); }
  toBottom(smooth) {
    let n = 0;
    const go = () => { const el = this.findList();
      if (el) { const target = el.scrollHeight - el.clientHeight; if (smooth && n === 0) el.scrollTo({ top: target, behavior: 'smooth' }); else el.scrollTop = target; }
      if (++n < 4) requestAnimationFrame(go); };
    requestAnimationFrame(go);
    setTimeout(() => { const el = this.findList(); if (el) el.scrollTop = el.scrollHeight; }, 380);
  }
  match(q) {
    const t = ' ' + q.toLowerCase().replace(/[^\p{L}\p{N}+ ]+/gu, ' ') + ' ';
    let best = null, score = 0;
    for (const e of this.KB) { let s = 0; for (const k of e.k) if (t.includes(k.includes(' ') ? k : ' ' + k)) s += k.length > 4 ? 2 : 1; if (s > score) { score = s; best = e; } }
    return score ? best : null;
  }
  async ask(text) {
    const q = (text || '').trim(); if (!q || this.state.typing) return;
    const hist = [...this.state.msgs, { role: 'user', text: q }];
    this.setState({ msgs: hist, draft: '', typing: true, nudge: false, unread: false }); this.save(hist); this.toBottom(true); this.autosize();
    const hit = this.match(q), links = hit ? hit.l : [];
    let answer = null;
    const useAI = this.props.useAI !== false && window.claude && window.claude.complete;
    if (useAI) {
      try {
        const messages = hist.slice(-10).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
        while (messages.length && messages[0].role !== 'user') messages.shift();
        answer = await window.claude.complete({ system: this.SYSTEM(), messages, max_tokens: 500 });
        answer = (answer || '').replace(/\*\*/g, '').replace(/^#+\s*/gm, '').trim();
      } catch (e) { answer = null; }
    } else { await new Promise(r => setTimeout(r, 550 + Math.random() * 400)); }
    if (!answer) answer = hit ? hit.a : "I'm not sure about that one. A person can help at hello@wasecret.com — or try asking about features, pricing, privacy, shortcuts or setup.";
    const ll = links.length ? links : (answer.includes('hello@wasecret.com') ? ['contact'] : []);
    const next = [...this.state.msgs, { role: 'bot', text: answer, links: ll }];
    this.setState({ typing: false, msgs: next }); this.save(next); this.toBottom(true);
  }
  renderVals() {
    const s = this.state;
    const welcome = { role: 'bot', text: "Hi! I'm the WA Blur assistant. Ask me anything about blurring and locking WhatsApp Web, pricing, privacy or setup.", links: [] };
    const all = [welcome, ...s.msgs];
    const msgs = all.map(m => { const links = (m.links || []).map(k => this.L[k]).filter(Boolean);
      return { bot: m.role !== 'user', user: m.role === 'user', text: m.text, links, hasLinks: links.length > 0 }; });
    const asked = new Set(s.msgs.filter(m => m.role === 'user').map(m => m.text));
    const pool = this.SUGGEST.filter(q => !asked.has(q));
    const showSuggest = !s.typing && pool.length > 0 && s.msgs.length < 8;
    const canSend = s.draft.trim().length > 0 && !s.typing;
    return {
      open: s.open, closed: !s.open, msgs, typing: s.typing, listRef: this.listRef, inputRef: this.inputRef,
      statusLine: s.typing ? 'Typing…' : 'Online · usually answers instantly',
      showSuggest, suggestLabel: s.msgs.length ? 'You can also ask' : 'Popular questions',
      suggest: pool.slice(0, s.msgs.length ? 3 : 6).map(q => ({ q, ask: () => this.ask(q) })),
      draft: s.draft, onDraft: e => { this.setState({ draft: e.target.value }); this.autosize(); },
      onKey: e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.ask(s.draft); } },
      onFocus: () => this.setState({ focus: true }), onBlur: () => this.setState({ focus: false }),
      inputBd: s.focus ? '#4E8A1A' : '#E6EDDC',
      submit: e => { e.preventDefault(); this.ask(s.draft); },
      cantSend: !canSend, sendBg: canSend ? '#4E8A1A' : '#B9D39A',
      toggle: () => { if (this.state.open) this.setState({ open: false }); else this.openChat(); },
      close: () => this.setState({ open: false }),
      reset: () => { this.setState({ msgs: [], draft: '' }); this.save([]); this.toBottom(false); },
      showNudge: s.nudge && !s.open, unread: s.unread && !s.open,
      launcherBg: s.open ? '#1F2A17' : '#4E8A1A', launcherLabel: s.open ? 'Close chat' : 'Open chat',
      launcherAnim: s.open ? 'none' : 'cbRing 2.2s ease-out infinite',
    };
  }
}
</script>
